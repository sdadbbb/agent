<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 测试 Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">AI 测试 Agent</div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Agent 执行</a>
            <a href="/cases" class="nav-link {% if request.path == '/cases' %}active{% endif %}">用例管理</a>
            <a href="/reports" class="nav-link {% if request.path == '/reports' %}active{% endif %}">测试报告</a>
            <a href="#" class="nav-link nav-exit" onclick="shutdownApp()" title="关闭程序">退出</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/agent.js"></script>
    <script src="/static/js/cases.js"></script>
    <script src="/static/js/reports.js"></script>
    <script>
    function shutdownApp() {
        if (!confirm('确定要退出程序吗？')) return;
        fetch('/api/shutdown', { method: 'POST' })
            .catch(function() {})
            .finally(function() {
                document.body.innerHTML = '<div style="text-align:center;padding-top:100px;font-size:18px;"><p>程序已关闭，可以关闭此页面。</p></div>';
            });
    }
    </script>
</body>
</html>
